version: "3.8"

# ─────────────────────────────────────────────────────────────────────────
# Un solo servicio `api` (docker compose up --build):
#
#   api (puerto 8080, host) — Flask + gunicorn (ver Dockerfile), un único
#   pipeline global: reglas + BETO + T5 fusionado con el LoRA gramatical.
#   No hay worker, cola ni Redis: no existe entrenamiento ni memoria por
#   alumno en el runtime.
#
# Volúmenes:
#   - ./models  (modelo base T5 fusionado + LoRA gramatical global + hf-cache)
#   - ./data    (historial CSV de feedback aceptado, para curación offline)
#
# GPU: el bloque `deploy.resources.reservations.devices` requiere NVIDIA
# Container Toolkit en el host. Si la VM no tiene GPU, coméntalo y el
# servicio cae a CPU (más lento, pero funciona igual).
#
# Si se necesita un proxy delante (TLS, etc.), nginx.conf sigue apuntando
# a este único servicio; por defecto se expone el puerto de la API directo.
# ─────────────────────────────────────────────────────────────────────────

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      # MODEL_VERSION: "beto-t5-base@04c598db+global-lora-v1@19ec2e4c"  # opcional; obligatoria si ENABLE_T5=false
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
