events {}

http {
    # Proxy delante del único servicio `api` (docker-compose.gpu.yml lo publica en
    # el puerto 80 de la VM; gunicorn ya no se expone a internet).
    #
    # Por qué (2026-10-01): la IA se colgó dos veces con los 4 hilos de gunicorn
    # bloqueados leyendo la CABECERA de peticiones que nunca terminaban de llegar
    # (escáneres de internet: "GET /", sondas RDP "mstshash"). gunicorn gthread no
    # pone plazo a esa lectura, así que 4 conexiones a medias bastan para dejarla
    # sin hilos. nginx recibe la petición COMPLETA (con plazo) y solo entonces se
    # la pasa a gunicorn, que ya no espera a nadie.
    server_tokens off;

    # Plazos para el cliente: quien no manda la petición entera a tiempo, fuera.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     15s;
    # Los textos y el feedback ocupan pocos KB.
    client_max_body_size  64k;

    # Conexiones simultáneas por IP: el backend (Cloud Run) usa pocas IPs y un
    # salón entero (35 alumnos) cabe de sobra.
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;

    log_format timed '$remote_addr [$time_local] "$request" $status $request_time s';
    access_log /dev/stdout timed;
    error_log  /dev/stderr warn;

    upstream api_backend {
        server api:8080;
    }

    server {
        listen 80 default_server;
        limit_conn per_ip 64;

        # Solo las rutas del servicio llegan a gunicorn; el resto (escáneres) no.
        location /interno/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
